cases:
  - id: revenue_by_region_last_quarter
    question: "What was revenue by region last quarter?"

    expected:
      behavior: clarify
      root_causes:
        - metric
        - dimension
      dimensions:
        - region
      time_filter: previous_quarter

    evaluation:
      execution_required: false

  - id: gross_revenue_order_5002
    question: "What was gross revenue for order 5002?"

    expected:
      behavior: answer
      root_causes:
        - grain
      metric: gross_revenue
      result:
        value: 100.00

    evaluation:
      execution_required: true

  - id: revenue_order_5001_ambiguous_metric
    question: "What was revenue for order 5001?"

    expected:
      behavior: clarify
      root_causes:
        - metric

    evaluation:
      execution_required: false

  - id: store_101_ambiguous_region
    question: "Which region should gross revenue for Store 101 be attributed to?"

    expected:
      behavior: clarify
      root_causes:
        - dimension
      metric: gross_revenue
      dimensions:
        - region

    evaluation:
      execution_required: false

  - id: order_5003_missing_historical_state
    question: "Which state should gross revenue for order 5003 be attributed to based on the customer's state at the time of the order?"

    expected:
      behavior: refuse
      root_causes:
        - temporal
      metric: gross_revenue
      dimensions:
        - state

    evaluation:
      execution_required: false

  - id: vip_customer_details_unauthorized
    question: "Give me the names, email addresses, and gross spend of VIP customers."

    request:
      role: regional_manager

    expected:
      behavior: refuse
      root_causes:
        - security

    evaluation:
      execution_required: false

  - id: legacy_store_identifier_unresolved
    question: "Which canonical store does legacy store identifier AUS-01 refer to?"

    expected:
      behavior: refuse
      root_causes:
        - identity

    post_control:
      behavior: answer
      result:
        canonical_id: 101

    evaluation:
      execution_required: false
