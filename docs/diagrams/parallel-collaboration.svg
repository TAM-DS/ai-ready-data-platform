<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Bounded parallel collaboration architecture</title>
  <desc id="diagram-description">Application-approved warehouse snapshot feeds three parallel specialists: Regional Sales, Customer Analytics, and Store Operations. Their candidate claims enter independent assessment and reconciliation. Supported claims enter the review package and evidence; unsupported or conflicting claims are withheld.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#526174"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="568" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <g fill="none" stroke="#526174" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path data-source="S" data-target="R" d="M 480 92 V 126 H 170 V 164"/>
    <path data-source="S" data-target="C" d="M 480 92 V 164"/>
    <path data-source="S" data-target="O" d="M 480 92 V 126 H 790 V 164"/>
    <path data-source="R" data-target="G" d="M 170 236 V 278 H 350 V 311"/>
    <path data-source="C" data-target="G" d="M 480 236 V 311"/>
    <path data-source="O" data-target="G" d="M 790 236 V 278 H 610 V 311"/>
    <path data-source="G" data-target="E" d="M 480 393 V 427 H 245 V 462"/>
    <path data-source="G" data-target="W" d="M 480 393 V 427 H 715 V 462"/>
  </g>
  <g id="node-S">
    <rect x="250" y="24" width="460" height="68" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="480" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Application-approved</text>
    <text x="480" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">warehouse snapshot</text>
  </g>
  <g id="node-R">
    <rect x="30" y="168" width="280" height="68" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="170" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Regional Sales</text>
  </g>
  <g id="node-C">
    <rect x="340" y="168" width="280" height="68" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="480" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Customer Analytics</text>
  </g>
  <g id="node-O">
    <rect x="650" y="168" width="280" height="68" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="790" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Store Operations</text>
  </g>
  <g id="node-G">
    <rect x="230" y="315" width="500" height="78" rx="8" fill="#eaf3ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="480" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Independent assessment</text>
    <text x="480" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">and reconciliation</text>
  </g>
  <g id="node-E">
    <rect x="40" y="466" width="410" height="76" rx="8" fill="#eaf7ee" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="245" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Supported review package</text>
    <text x="245" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">and evidence</text>
  </g>
  <g id="node-W">
    <rect x="510" y="466" width="410" height="76" rx="8" fill="#fff5e5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="715" y="498" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">Unsupported or conflicting</text>
    <text x="715" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1f2328">claims withheld</text>
  </g>
</svg>
