name: Evaluation Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-collaboration.txt

      - name: Validate Python syntax
        run: python -m compileall -q platform_agents collaboration tests evals semantic policy

      - name: Test bounded collaboration and offline SDK integration
        run: python -m unittest discover -s tests -v

      - name: Replay committed collaboration evidence
        run: |
          python -m collaboration verify evals/collaboration_invalid_fixture.json
          python -m collaboration verify evals/collaboration_invalid_fixture-sequential.json
          python - <<'PY'
          import json
          from pathlib import Path

          parallel = json.loads(Path("evals/collaboration_invalid_fixture.json").read_text())
          sequential = json.loads(Path("evals/collaboration_invalid_fixture-sequential.json").read_text())
          if parallel["summary"] != sequential["summary"]:
              raise SystemExit("Persisted sequential/parallel review decisions differ.")
          print("PASS persisted sequential/parallel decision equivalence")
          PY

      - name: Validate evaluation cases
        run: python evals/run.py

      - name: Verify governed control evidence
        run: python evals/controls.py

      - name: Verify adversarial scorecard evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from evals.adversarial_scorecard import build_scorecard

          path = Path("evals/adversarial_scorecard.json")

          persisted = json.loads(
              path.read_text(encoding="utf-8")
          )

          rebuilt = build_scorecard()

          if rebuilt != persisted:
              raise SystemExit(
                  "Adversarial scorecard does not match persisted evidence."
              )

          print("PASS adversarial scorecard matches persisted evidence")
          PY
